<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Room</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f4;
      }
      #chat-container {
        width: 400px;
        padding: 20px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }
      #messages {
        height: 300px;
        overflow-y: auto;
        margin-bottom: 15px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #fafafa;
        list-style: none;
      }
      #messages li {
        margin: 5px 0;
      }
      #chat-form {
        display: flex;
      }
      #message-input {
        flex: 1;
        padding: 8px;
        font-size: 14px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      #send-button {
        padding: 8px 15px;
        margin-left: 10px;
        background: #007bff;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
      #send-button:hover {
        background: #0056b3;
      }
      .user-info {
        background: #e9ecef;
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
        font-weight: bold;
      }
      .room-controls {
        margin: 15px 0;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      #chat-section {
        display: none;
      }
      button {
        padding: 8px 15px;
        background: #007bff;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        margin: 5px;
      }
      button:hover {
        background: #0056b3;
      }
      input {
        padding: 8px;
        margin: 5px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      select {
        padding: 8px;
        margin: 5px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="chat-container">
      <h1>Chat Room</h1>

      <div id="name-section">
        <h2>Enter your name:</h2>
        <input type="text" id="username-input" placeholder="Enter your name" />
        <button id="set-name-button">Set Name</button>
      </div>

      <div id="chat-section">
        <div id="user-display" class="user-info">Current User: Not Set</div>

        <div class="room-controls">
          <div>
            <input
              type="text"
              id="create-room-input"
              placeholder="Enter new room name"
            />
            <button id="create-room">Create Room</button>
          </div>
          <div>
            <select id="room-selector"></select>
            <button id="join-room">Join Room</button>
          </div>
        </div>

        <div id="messages"></div>

        <form id="message-form">
          <input
            type="text"
            id="message-input"
            placeholder="Enter your message"
            required
          />
          <button type="submit">Send</button>
        </form>
      </div>
    </div>

    <!-- Include Socket.io client script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.3/socket.io.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
