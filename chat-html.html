<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Room</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f4;
      }
      #chat-container {
        width: 400px;
        padding: 20px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }
      #messages {
        height: 300px;
        overflow-y: auto;
        margin-bottom: 15px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #fafafa;
        list-style: none;
      }
      #messages li {
        margin: 5px 0;
      }
      #chat-form {
        display: flex;
      }
      #message-input {
        flex: 1;
        padding: 8px;
        font-size: 14px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      #send-button {
        padding: 8px 15px;
        margin-left: 10px;
        background: #007bff;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
      #send-button:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <div id="chat-container">
    <h1>Chat Room</h1>
    <select id="room-selector">
      <option value="testing">General</option>
    </select>
    <button id="join-room">Join Room</button>

    <div id="messages"></div>

    <form id="message-form">
      <input type="text" id="message-input" placeholder="Enter your message" required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const socket = io("http://localhost:3000");
    const roomSelector = document.getElementById("room-selector");
    const joinRoomButton = document.getElementById("join-room");
    const messagesDiv = document.getElementById("messages");
    const messageForm = document.getElementById("message-form");
    const messageInput = document.getElementById("message-input");

    let currentRoom = null;

    // Join a room
    joinRoomButton.addEventListener("click", () => {
      const selectedRoom = roomSelector.value;
      if (currentRoom) {
        socket.emit("leaveRoom", currentRoom);
      }
      currentRoom = selectedRoom;
      socket.emit("joinRoom", currentRoom);
      messagesDiv.innerHTML = ""; // Clear chat window when changing rooms
      addMessage(`You joined room: ${currentRoom}`);
    });

    // Listen for messages from the server
    socket.on("message", (message) => {
      addMessage(message);
    });

    // Send message to the room
    messageForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const message = messageInput.value.trim();
      if (message) {
        socket.emit("chatMessage", { room: currentRoom, message });
        addMessage(`You: ${message}`);
        messageInput.value = ""; // Clear input
      }
    });

    // Add a message to the chat window
    function addMessage(message) {
      const messageElement = document.createElement("div");
      messageElement.textContent = message;
      messagesDiv.appendChild(messageElement);
      messagesDiv.scrollTop = messagesDiv.scrollHeight; // Scroll to the latest message
    }
  </script>
</body>
</html>
